[package]
name = "catena-qwen3"
version = "0.1.0"
edition = "2024"
default-run = "catena-qwen3"

[dependencies]
anyhow = "1.0"
catena-lang = { git = "ssh://git@github.com/hellas-ai/catena-lang.git", branch = "master", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
hf-hub = { version = "1.0.0", default-features = false, features = ["blocking", "rustls-tls"] }
libc = "0.2"
libloading = "0.9"
memmap2 = "0.9"
metacat = "0.3.0"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
jpeg-decoder = { version = "0.3", default-features = false }
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
hound = "3.5"
rustfft = "6.4"
