[package]
name = "catena-models"
version = "0.1.0"
edition = "2024"
default-run = "catena-models"

[dependencies]
anyhow = "1.0"
catena-lang = { git = "https://github.com/hellas-ai/catena-lang.git", rev = "325d75d20f6f82511ab330b2c678075f204379d8", version = "0.1.0" }
clap = { version = "4.5", features = ["derive", "env"] }
axum = "0.8"
http-body = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "macros"] }
tokio-stream = "0.1"
minijinja = { version = "2", features = ["json", "loop_controls"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
hf-hub = { version = "1.0.0", default-features = false, features = ["blocking", "rustls-tls"] }
libc = "0.2"
libloading = "0.9"
memmap2 = "0.9"
metacat = "0.3.0"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.33", default-features = false }
png = "0.18"
jpeg-decoder = { version = "0.3", default-features = false }
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
hound = "3.5"
half = "2.7"
rustfft = "6.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
