[package]
name = "catena-qwen3"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
catena-lang = { git = "ssh://git@github.com/hellas-ai/exploratory-catena.git", rev = "c1c1f27416ed1861d9776f0cfe23954e016cccca", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
memmap2 = "0.9"
safetensors = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
