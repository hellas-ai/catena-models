[package]
name = "catena-qwen3"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
catena-lang = { git = "ssh://git@github.com/georgewhewell/exploratory-catena.git", rev = "ed5eca3148c3e31234fe2fe7620c9d0363903f38", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
hf-hub = { version = "1.0.0", default-features = false, features = ["blocking", "rustls-tls"] }
libc = "0.2"
libloading = "0.9"
memmap2 = "0.9"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
