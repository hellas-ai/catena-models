[package]
name = "catena-qwen3"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
catena-lang = { git = "ssh://git@github.com/hellas-ai/exploratory-catena.git", rev = "3967f3eed7569126d42ce8f6ef9f4756823b7269", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
hf-hub = { version = "1.0.0", default-features = false, features = ["blocking", "rustls-tls"] }
libc = "0.2"
libloading = "0.9"
memmap2 = "0.9"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
